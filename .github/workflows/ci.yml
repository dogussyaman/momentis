name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      JWT_SECRET: ci-test-secret-min-32-chars-long-security
      MONGODB_URI: mongodb://localhost:27017/momentis_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test
